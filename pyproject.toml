[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-fair-price-france"
version = "0.1.0"
description = "Prototype d'indice de fair price SP95 et gazole en France"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "requests>=2.32",
]

[tool.setuptools.packages.find]
where = ["src"]
